# ============================================================
#  可视化后台配置（Sveltia CMS / Decap CMS 通用）
#
#  配置已填好，没有 TODO 了。
#  提交目标仓库：gggg666777/blog
#  登录地址：https://ysnb.store（由 functions/ 提供）
# ============================================================

backend:
  name: github
  repo: gggg666777/blog
  branch: main
  base_url: https://ysnb.store           # 登录接口跟着网站一起部署，无需单独配 Worker
  auth_endpoint: auth                    # 对应 functions/auth.js
  commit_messages:
    create: "cms: 新建《{{slug}}》"
    update: "cms: 更新《{{slug}}》"
    delete: "cms: 删除《{{slug}}》"
    uploadMedia: "cms: 上传图片 {{path}}"
    deleteMedia: "cms: 删除图片 {{path}}"

# 后台左上角显示
site_url: https://ysnb.store
display_url: https://ysnb.store

# 媒体文件存放位置（相对于仓库根目录）
media_folder: "src/images/uploads"
public_folder: "/images/uploads"

# 文章网址（slug）的生成规则
# encoding: unicode 表示保留中文，网址会是 /blog/文章标题/ 这样可读的形式。
# 如果改成 ascii，中文标题没法转成英文，CMS 会生成 /blog/1125716fc17b/ 这种乱码哈希。
slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    description: 博客文章，保存后会以 Markdown 提交到仓库
    folder: "src/posts"
    media_folder: ""
    public_folder: ""
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "title"]
    fields:
      - label: 标题
        name: title
        widget: string

      - label: 发布日期
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true

      - label: 摘要
        name: description
        widget: text
        required: false
        hint: 会显示在文章列表和搜索引擎结果里，建议 50-120 字

      - label: 标签
        name: labels
        widget: list
        required: false
        default: []
        hint: 每行一个，或者用逗号分隔

      - label: 封面图
        name: cover
        widget: image
        required: false
        choose_url: true

      - label: 草稿
        name: draft
        widget: boolean
        default: false
        hint: 打开后本地预览可见，但不会发布到线上

      - label: 正文
        name: body
        widget: markdown
